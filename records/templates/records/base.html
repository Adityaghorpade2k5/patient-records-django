{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Patient Records{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16211f;
    --ink-soft: #566360;
    --paper: #f1f4f3;
    --card: #ffffff;
    --rule: #d6dedb;
    --teal: #0f6b5c;
    --clay: #a63a2e;
    --amber: #b07d18;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --serif: "Newsreader", Georgia, serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 1040px; margin: 0 auto; padding: 32px 24px 72px; }

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 16px 24px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--ink);
  }
  .masthead h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .masthead h1 a { color: inherit; text-decoration: none; }
  .masthead .ward { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .masthead .spacer { flex: 1; }

  a { color: var(--teal); }

  .counts { display: flex; gap: 28px; margin: 18px 0 26px; }
  .counts div { display: flex; flex-direction: column; }
  .counts .figure {
    font-family: var(--serif);
    font-size: 26px;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .counts .label { font-size: 13px; color: var(--ink-soft); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
  }
  .toolbar form { display: flex; gap: 8px; flex-wrap: wrap; }

  input[type="text"], input[type="search"], input[type="number"],
  input[type="date"], select, textarea {
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 8px 10px;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible,
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }

  .btn {
    font: inherit;
    font-weight: 500;
    padding: 8px 15px;
    border-radius: 3px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    cursor: pointer;
    display: inline-block;
  }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
  .btn.danger { background: var(--clay); border-color: var(--clay); }

  table.register {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--rule);
  }
  .register th {
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 11px 14px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  .register td {
    padding: 13px 14px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }
  .register tr:last-child td { border-bottom: 0; }
  .register .reg {
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .register .name { font-weight: 500; }
  .register .name a { color: var(--ink); text-decoration: none; }
  .register .name a:hover { text-decoration: underline; }
  .register .dx { color: var(--ink-soft); }
  .register .acts { text-align: right; white-space: nowrap; }
  .register .acts a { margin-left: 12px; font-size: 14px; }
  .register .acts .remove { color: var(--clay); }

  /* the status spine: a coloured edge on each row instead of a pill badge */
  .spine { border-left: 4px solid transparent; padding-left: 10px; }
  .spine-AD { border-left-color: var(--clay); }
  .spine-OP { border-left-color: var(--teal); }
  .spine-DC { border-left-color: var(--rule); }
  .status-word { font-size: 13px; color: var(--ink-soft); }

  .empty {
    background: var(--card);
    border: 1px dashed var(--rule);
    padding: 40px 24px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty p { margin: 0 0 16px; }

  .sheet {
    background: var(--card);
    border: 1px solid var(--rule);
    padding: 26px 28px;
  }
  .sheet h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 25px;
    margin: 0 0 4px;
  }
  .sheet .subhead { color: var(--ink-soft); margin: 0 0 22px; font-size: 14px; }
  .sheet dl { display: grid; grid-template-columns: 180px 1fr; gap: 0; margin: 0; }
  .sheet dt {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 10px 0;
    border-top: 1px solid var(--rule);
  }
  .sheet dd {
    margin: 0;
    padding: 10px 0;
    border-top: 1px solid var(--rule);
  }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; }
  .field .help { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .field .error { font-size: 13px; color: var(--clay); margin-top: 4px; }
  .field.has-error input, .field.has-error select { border-color: var(--clay); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
  .form-grid .wide { grid-column: 1 / -1; }

  .actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .actions .cancel { color: var(--ink-soft); }

  .messages { list-style: none; margin: 0 0 22px; padding: 0; }
  .messages li {
    background: var(--card);
    border: 1px solid var(--rule);
    border-left: 4px solid var(--teal);
    padding: 11px 15px;
  }

  .crumb { margin: 0 0 16px; font-size: 14px; color: var(--ink-soft); }

  @media (max-width: 680px) {
    .form-grid { grid-template-columns: 1fr; }
    .sheet dl { grid-template-columns: 1fr; }
    .sheet dd { border-top: 0; padding-top: 0; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div>
      <h1><a href="{% url 'patient_list' %}">Patient Records</a></h1>
      <p class="ward">Outpatient &amp; ward register</p>
    </div>
    <span class="spacer"></span>
    <a class="btn" href="{% url 'patient_create' %}">Register a patient</a>
  </header>

  {% if messages %}
    <ul class="messages">
      {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
  {% endif %}

  {% block content %}{% endblock %}
</div>
</body>
</html>
